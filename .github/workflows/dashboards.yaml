# .github/workflows/dashboards-api-tests.yaml
name: Dashboards API Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      grafana:
        image: grafana/grafana:latest
        ports:
          - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
        # No container healthcheck to avoid tool deps; we'll wait from the host.

    env:
      API_BASE_URL: http://localhost:3000
      GRAFANA_USER: admin
      GRAFANA_PASS: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest requests
          fi

      - name: Wait for Grafana to be ready
        run: |
          for i in {1..90}; do
            if curl -sf "$API_BASE_URL/api/health" >/dev/null; then
              echo "Grafana is up"; exit 0
            fi
            sleep 2
          done
          echo "Grafana did not become healthy in time" >&2
          exit 1

      - name: Run Dashboards API tests
        run: |
          pytest pkg/tests/api/dashboards
