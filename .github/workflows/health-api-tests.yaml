# .github/workflows/health-api-tests.yaml
name: Health API Tests

on:
  push:
    paths:
      - 'pkg/tests/api/health/**'
      - '.github/workflows/health-api-tests.yaml'
  pull_request:
    paths:
      - 'pkg/tests/api/health/**'
      - '.github/workflows/health-api-tests.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pkg/tests/api/health/requirements.txt ]; then
            pip install -r pkg/tests/api/health/requirements.txt
          else
            pip install pytest requests
          fi

      - name: Run tests
        run: |
          python -m pytest -q pkg/tests/api/health \
            --maxfail=1 \
            --junitxml=report.xml
